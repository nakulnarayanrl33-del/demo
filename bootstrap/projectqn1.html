<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Signup form</title>
</head>
<body class="bg-primary">
    <div class="container my-5">
  <div class=" card pl-4 pr-4 pb-5 pt-5" >
    <div class="card-body">
    <div class="container">
<form>
    <h1><b>Sign Up</b></h1>
    <p class="text-secondary">Please fill in this form to create an account</p>
  <div class="row mb-2">
    <div class="col-12 col-md-6 mb-3">
      <input type="text" class="form-control bg-light border-0" placeholder="First Name" name="fname">
    </div>
    <div class="col-12 col-md-6 mb-3">
      <input type="text" class="form-control bg-light border-0" placeholder="Last Name" name="lname">
    </div>
  </div>
  <div class="form-group mb-1 ">
        <label for="email"></label>
        <input type="email" class="form-control bg-light border-0" id="email" placeholder="Email" name="email">
    </div>
    <div class="form-group mb-1">
      <label for="pwd"></label>
      <input type="password" class="form-control bg-light border-0" id="pwd" placeholder="Password" name="pswd">
    </div>
    <div class="form-group mb-1">
      <label for="pwd"></label>
      <input type="password" class="form-control bg-light border-0" id="pwd" placeholder="Confirm Password" name="pswd">
    </div>
    <div class="form-group form-check">
      <label class="form-check-label">
        <input class="form-check-input" type="checkbox" name="remember" ><span class="text-secondary">I accept the</span> <span class="text-primary">Terms of Use</span> <span class="text-secondary">&</span> <span class="text-primary">Privacy Policy</span>
      </label>
    </div>
    <button type="submit" class="btn btn-primary w-25" ><b>Sign Up</b></button>
</form>
    </div>
    </div>
  </div>
    <p class="mt-3 text-white text-center">Already have an account?<a class="text-white" href="#"><u>Login here.</u></a></p>
    </div>
    
</body>
</html>
