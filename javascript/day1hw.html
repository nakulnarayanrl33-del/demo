<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        var riceName="Rice";
        var sugarName="Sugar";
        var wheatName="Wheat";

        var ricePrice=150;
        var sugarPrice=100;
        var wheatPrice=50;

        var ricequantity=5;
        var sugarquantity=2;
        var wheatquantity=6;

        var ricecost=ricePrice*ricequantity
        var sugarcost=sugarPrice*sugarquantity
        var wheatcost=wheatPrice*wheatquantity

        console.log("The price of the rice is:"+ricecost);
        console.log("The price of the sugar is:"+sugarcost);
        console.log("The price of the wheat is:"+wheatcost);
        console.log("The total price is"+(ricecost+sugarcost+wheatcost))

        ricequantity=10;
        ricecost=ricequantity+ricePrice;
        console.log("The updated price"+ricecost);
        console.log("The updated total price is"+(ricecost+sugarcost+wheatcost))
    </script>
