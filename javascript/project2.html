<!DOCTYPE html>
<html>
<head>
    <title>Lottery Draw</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="text-center mt-5">

<h2>Lottery Draw</h2>

<button class="btn btn-primary" onclick="drawWinner()">Draw Winner</button>

<h3 id="result"></h3>


<div class="modal fade" id="winnerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Winner</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <p id="modalText"></p>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let tickets = [11, 22, 33, 44, 55, 66];

function drawWinner() {
    if (tickets.length === 0) {
        return;
    }

    let index = Math.floor(Math.random() * tickets.length);
    let winner = tickets[index];

    console.log("Winner:", winner);

    document.getElementById("result").style.color="red";

    document.getElementById("result").innerText = "Winner: " + winner;

    document.getElementById("modalText").innerText = "Winner is: " + winner;

    let modal = new bootstrap.Modal(document.getElementById('winnerModal'));
    modal.show();
}
</script>

</body>
</html>
