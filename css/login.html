<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        label{display:block;
            margin-bottom: 5px;}
            button{
                background-color: orangered;
                color: white;
            }
           button{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 16px;
           }

        
    </style>
</head>
<body>

<div class="container">

    <div class="image-box">
        
    </div>

    <div class="login-box">
        <h2>Login Form</h2>
<div class="email">
    </div>
        <label>Email :</label>
        <input type="text" placeholder="Enter email">

        <label>Password :</label>
        <input type="password" placeholder="Enter password">

        <div class="remember">
            <input type="checkbox"> Remember Me
        </div>

        <button>Login</button>
    </div>

</div>

</body>
</html>
