<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p>The price of 5 t-shirt:</p>
    <p id="shirt1"></p>
    <p>The price of 3 caps is:</p>
    <p id="caps"></p>
    <p>Total price is:</p>
    <p id="total"></p>
    <p>The price of 5 t-shirt:</p>
    <p id="shirt2"></p>
    <p>The price of 3 caps is:</p>
    <p id="caps2"></p>
    <p>Updated total price</p>
    <p id="total2"></p>
    <script>
        var tshirt=400*5
        var caps=150*3
        document.getElementById("shirt1").innerHTML= tshirt;
        document.getElementById("caps").innerHTML= caps;
        document.getElementById("total").innerHTML= tshirt+caps;
        
        var tshirt=450*5
        var caps=150*3
        document.getElementById("shirt2").innerHTML= tshirt;
        document.getElementById("caps2").innerHTML= caps;
        document.getElementById("total2").innerHTML= tshirt+caps;

    </script>     
</body>
</html>
