<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>BUN CAFE</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
    <div class="row justify-content-center">
    <div class="col-md-6"> 
        <div class="card shadow p-4">   
    <h1 class="text-center mb-4 font-weight-bold"><b>BUNCAFE</b></h1>
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" class="form-control" id="text" placeholder="Enter name" name="name">
    </div>
    <div class="input-group mb-3">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
      <div class="input-group-append">
        <span class="input-group-text">@gmail.com</span>
      </div>
    </div>
    <div class="form-group">
        <label for="feedback">Feedback:</label>
        <textarea class="form-control" rows="3" id="feedback"></textarea>
    </div>
    <div class="input-group mt-3 mb-3">
        <div class="input-group-prepend">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-toggle="dropdown">CONTACTS</button>
        <div class="dropdown-menu">
            <a class="dropdown-item" href="#">PHONE NUMBER</a>
            <a class="dropdown-item" href="#">EMAIL ID</a>
        </div>
    </div>
    <input type="text" class="form-control" placeholder="contact"> 
    </div>
    <div class="form-group">
      <input type="range" class="form-control-range" name="range">
    </div>
    <h2 style="text-align: center;" >Satisfication Level</h2>
    <div class="input-group mt-3 mb-3">
  <div class="input-group-prepend">
    <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-toggle="dropdown">
      Select one
    </button>
    <div class="dropdown-menu">
      <a class="dropdown-item" href="#">Cake</a>
      <a class="dropdown-item" href="#">Cookies</a>
      <a class="dropdown-item" href="#">Pastries</a>
    </div>
  </div>
  <input type="text" class="form-control" placeholder="Favorite item ">
</div>
<button type="submit" class="btn btn-primary">Submit</button>
</body>
</html>
